name: Capture practice laps

# NASCAR never archives per-lap practice times — they exist ONLY in the live
# feed while a session runs. This workflow makes the capture automatic so no
# one has to be at a PC: every 30 minutes around race weekends it checks the
# NASCAR schedule (scripts/capture_watchdog.py); when a practice/qualifying
# session is live or starts within 40 minutes, it records every lap and
# commits them to nascar.db (captured_laps table). The app's Practice tab
# then shows "Best X Laps" + the Lap Chart automatically, on cloud and PC.
#
# No-op runs (no session near) exit in ~30 seconds. Sessions run Fri-Sun
# almost always; Thursday covers the occasional Daytona/eclipse-week oddity.

on:
  schedule:
    - cron: "*/30 * * * 4,5,6"   # Thu Fri Sat (UTC)
    - cron: "*/30 * * * 0,1"     # Sun + Mon-UTC spillover of Sunday-evening ET
  workflow_dispatch: {}          # manual runs from the Actions tab

permissions:
  contents: write                # commits captured laps back into nascar.db

concurrency:
  group: capture-practice
  cancel-in-progress: false      # never kill a live recording; extras queue
                                 # and exit as no-ops once the session is done

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (requests only — fast no-op runs)
        run: pip install requests

      - name: Scan schedule and capture any live session
        run: python scripts/capture_watchdog.py --window 40

      - name: Commit captured laps
        # The daily refresh job also commits nascar.db, so a push can race.
        # Recovery is lossless because captured laps are additive: export
        # them to JSON, hard-reset onto origin, re-import, re-commit.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            python scripts/capture_watchdog.py --export-json /tmp/captured.json
            git fetch origin
            git reset --hard origin/main
            python scripts/capture_watchdog.py --import-json /tmp/captured.json
            git add nascar.db
            if git diff --staged --quiet; then
              echo "No new captured laps — nothing to commit."
              break
            fi
            git commit -m "Auto-capture practice laps ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            if git push; then
              break
            fi
            echo "Push raced with another job — retrying ($attempt/3)"
          done
